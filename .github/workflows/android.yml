name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'dashboard/**']

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HEY_KEY_ALIAS: heytools
      EXPECTED_SIGNER_SHA256: 321beac46b1dbb353c1bd6cae9f6960301dd636d1141eed9a049cbfd6ff6f9e7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # The existing public APK is signed by this certificate. Never silently generate a
      # replacement key: that would make updates fail for everyone with the installed app.
      - name: Restore the existing signing key
        id: signing-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/heytools-signing
          key: heytools-signing-v1

      - name: Prepare and verify the existing signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CACHE_HIT: ${{ steps.signing-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          DIR="$HOME/heytools-signing"
          mkdir -p "$DIR"
          if [ -n "$KS_B64" ] || [ -n "$KS_PASS" ]; then
            if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
              echo "::error::Both ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD must be configured."
              exit 1
            fi
            printf '%s' "$KS_B64" | base64 --decode > "$DIR/heytools.p12"
            PASS="$KS_PASS"
          else
            if [ "$CACHE_HIT" != "true" ] || [ ! -s "$DIR/heytools.p12" ] || [ ! -s "$DIR/pass.txt" ]; then
              echo "::error::The existing signing key was not restored. Do not generate a new key. Restore the original HeyTools keystore and configure repository secrets before publishing."
              exit 1
            fi
            PASS="$(cat "$DIR/pass.txt")"
          fi
          chmod 600 "$DIR/heytools.p12"
          keytool -list -keystore "$DIR/heytools.p12" -storetype PKCS12 -alias "$HEY_KEY_ALIAS" -storepass "$PASS" >/dev/null
          FINGERPRINT="$(keytool -list -v -keystore "$DIR/heytools.p12" -storetype PKCS12 -alias "$HEY_KEY_ALIAS" -storepass "$PASS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$FINGERPRINT" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::Signing certificate mismatch. Refusing to publish an incompatible Android update."
            exit 1
          fi
          echo "::add-mask::$PASS"
          echo "HEY_KEYSTORE=$DIR/heytools.p12" >> "$GITHUB_ENV"
          echo "HEY_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "Verified existing HeyTools signing certificate: $FINGERPRINT"

      - name: Install Capacitor
        working-directory: native
        run: npm install

      - name: Copy the website into the app
        working-directory: native
        run: node scripts/prepare-web.js

      - name: Create the Android project
        working-directory: native
        run: npx cap add android

      - name: Add media access, notifications, alarm tones, version and signing
        working-directory: native
        run: node scripts/patch-android.js

      - name: Sync
        working-directory: native
        run: npx cap sync android

      - name: Build the signed APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify package, version and APK signature
        id: apk
        run: |
          set -euo pipefail
          cp native/android/app/build/outputs/apk/release/app-release.apk HeyTools.apk
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs HeyTools.apk | tee apk-signature.txt
          CERT="$(awk -F': ' '/certificate SHA-256 digest:/{print $NF; exit}' apk-signature.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$EXPECTED_SIGNER_SHA256"
          echo "Available Android package tools:"
          ls -l "$BUILD_TOOLS"/aapt*
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging HeyTools.apk)"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 '^package:')"
          echo "APK package metadata: $PACKAGE_LINE"
          test -n "$PACKAGE_LINE"
          ACTUAL_PACKAGE="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
          ACTUAL_CODE="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          ACTUAL_NAME="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          echo "Verified APK metadata: package=$ACTUAL_PACKAGE versionCode=$ACTUAL_CODE versionName=$ACTUAL_NAME"
          test "$ACTUAL_PACKAGE" = "com.heytools.app"
          test "$ACTUAL_CODE" = "$GITHUB_RUN_NUMBER"
          test "$ACTUAL_NAME" = "1.0"
          echo "sha=$(sha256sum HeyTools.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HeyTools-apk
          path: HeyTools.apk

      - name: Publish the latest APK as a release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: android-latest
          name: HeyTools for Android (latest)
          body: |
            HeyTools 1.0 · Build ${{ github.run_number }}

            Download HeyTools.apk on your phone and open it.
            The APK signature is verified against the existing HeyTools update certificate.

            SHA-256: ${{ steps.apk.outputs.sha }}
            Signing certificate SHA-256: ${{ steps.apk.outputs.cert }}
          files: HeyTools.apk
