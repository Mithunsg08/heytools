name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'dashboard/**']

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HEY_KEY_ALIAS: heytools
      EXPECTED_SIGNER_SHA256: 321beac46b1dbb353c1bd6cae9f6960301dd636d1141eed9a049cbfd6ff6f9e7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # The release signing key lives ONLY in GitHub Secrets (ANDROID_KEYSTORE_BASE64 and
      # ANDROID_KEYSTORE_PASSWORD). Secrets are encrypted and never visible in this public
      # repository. Never generate a replacement key: it would break updates for everyone
      # who already has the app installed (the certificate is pinned below).
      #
      # TEMPORARY MIGRATION FALLBACK: until the secrets are set, the old Actions cache copy is
      # read (restore only, never saved again). Run "Signing key migration" -> set-secrets or
      # export, then purge. See SIGNING.md. Once purged this step does nothing.
      - name: Restore legacy cached key (fallback until the secrets are valid)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/heytools-signing
          key: heytools-signing-v1

      - name: Prepare and verify the signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/heytools-signing"
          LEGACY="$HOME/heytools-signing"
          mkdir -p "$DIR"
          fp() { keytool -list -v -keystore "$1" -storetype PKCS12 -alias "$HEY_KEY_ALIAS" -storepass "$2" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]'; }
          PASS=""
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            # Normalize whitespace/newlines before decoding a secret pasted from a terminal.
            if printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 --decode > "$DIR/heytools.p12" 2>/dev/null && [ "$(fp "$DIR/heytools.p12" "$KS_PASS")" = "$EXPECTED_SIGNER_SHA256" ]; then
              PASS="$KS_PASS"; echo "Using the signing key from GitHub Secrets."
            else
              echo "::warning::The ANDROID_KEYSTORE_* secrets are set but are not a valid HeyTools key (bad base64, wrong password or wrong certificate). Fix them (see SIGNING.md). Trying the legacy cache copy instead."
              rm -f "$DIR/heytools.p12"
            fi
          fi
          if [ -z "$PASS" ] && [ -s "$LEGACY/heytools.p12" ] && [ -s "$LEGACY/pass.txt" ]; then
            cp "$LEGACY/heytools.p12" "$DIR/heytools.p12"
            PASS="$(cat "$LEGACY/pass.txt")"
            echo "::warning::Signing key came from the legacy Actions cache. Move it to GitHub Secrets and purge the cache (see SIGNING.md)."
          fi
          if [ -z "$PASS" ]; then
            echo "::error::No valid signing key found. Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets (see SIGNING.md). Do not generate a replacement key."
            exit 1
          fi
          echo "::add-mask::$PASS"
          chmod 600 "$DIR/heytools.p12"
          keytool -list -keystore "$DIR/heytools.p12" -storetype PKCS12 -alias "$HEY_KEY_ALIAS" -storepass "$PASS" >/dev/null
          FINGERPRINT="$(keytool -list -v -keystore "$DIR/heytools.p12" -storetype PKCS12 -alias "$HEY_KEY_ALIAS" -storepass "$PASS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$FINGERPRINT" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::Signing certificate mismatch. Refusing to publish an incompatible Android update."
            exit 1
          fi
          echo "HEY_KEYSTORE=$DIR/heytools.p12" >> "$GITHUB_ENV"
          echo "HEY_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "Verified HeyTools signing certificate: $FINGERPRINT"

      - name: Install Capacitor
        working-directory: native
        run: npm install

      - name: Copy the website into the app
        working-directory: native
        run: node scripts/prepare-web.js

      - name: Create the Android project
        working-directory: native
        run: npx cap add android

      - name: Add media access, notifications, alarm tones, version and signing
        working-directory: native
        run: node scripts/patch-android.js

      - name: Sync
        working-directory: native
        run: npx cap sync android

      - name: Build the signed APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify package, version and APK signature
        id: apk
        run: |
          set -euo pipefail
          cp native/android/app/build/outputs/apk/release/app-release.apk HeyTools.apk
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs HeyTools.apk | tee apk-signature.txt
          CERT="$(awk -F': ' '/certificate SHA-256 digest:/{print $NF; exit}' apk-signature.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$EXPECTED_SIGNER_SHA256"
          echo "Available Android package tools:"
          ls -l "$BUILD_TOOLS"/aapt*
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging HeyTools.apk)"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 '^package:')"
          echo "APK package metadata: $PACKAGE_LINE"
          test -n "$PACKAGE_LINE"
          ACTUAL_PACKAGE="$(printf '%s\n' "$PACKAGE_LINE" | awk -F"'" '{print $2}')"
          ACTUAL_CODE="$(printf '%s\n' "$PACKAGE_LINE" | grep -o "versionCode='[^']*'" | head -1 | cut -d"'" -f2)"
          ACTUAL_NAME="$(printf '%s\n' "$PACKAGE_LINE" | grep -o "versionName='[^']*'" | head -1 | cut -d"'" -f2)"
          echo "Verified APK metadata: package=$ACTUAL_PACKAGE versionCode=$ACTUAL_CODE versionName=$ACTUAL_NAME"
          test "$ACTUAL_PACKAGE" = "com.heytools.app"
          test "$ACTUAL_CODE" = "$GITHUB_RUN_NUMBER"
          test "$ACTUAL_NAME" = "1.0"
          echo "sha=$(sha256sum HeyTools.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HeyTools-apk
          path: HeyTools.apk

      - name: Publish the latest APK as a release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: android-latest
          name: HeyTools for Android (latest)
          body: |
            HeyTools 1.0 · Build ${{ github.run_number }}

            Download HeyTools.apk on your phone and open it.
            The APK signature is verified against the existing HeyTools update certificate.

            SHA-256: ${{ steps.apk.outputs.sha }}
            Signing certificate SHA-256: ${{ steps.apk.outputs.cert }}
          files: HeyTools.apk
