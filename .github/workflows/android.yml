name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor
        working-directory: native
        run: npm install
      - name: Copy the website into the app
        working-directory: native
        run: node scripts/prepare-web.js
      - name: Create the Android project
        working-directory: native
        run: npx cap add android
      - name: Add media access, permissions and icon
        working-directory: native
        run: node scripts/patch-android.js
      - name: Sync
        working-directory: native
        run: npx cap sync android
      - name: Build the APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp native/android/app/build/outputs/apk/debug/app-debug.apk HeyTools.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HeyTools-apk
          path: HeyTools.apk
      - name: Publish the latest APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: HeyTools for Android (latest)
          body: Download HeyTools.apk, open it on your phone and allow "Install unknown apps" when asked.
          files: HeyTools.apk
