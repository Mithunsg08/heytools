name: Build HeyTools app

# Run it by hand (Actions tab -> "Build HeyTools app" -> Run workflow) or push a tag like  app-v1.0.0
on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

defaults:
  run:
    working-directory: app

jobs:
  web:
    name: Offline web bundle (PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build:web:strict
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: heytools-web
          path: app/www
          if-no-files-found: error

  android:
    name: Android APK (phones + tablets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npm run android:init
      - run: ./gradlew assembleDebug
        working-directory: app/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk HeyTools-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: heytools-android-debug-apk
          path: app/HeyTools-Android.apk
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build:web:strict
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned builds; add signing secrets when you are ready
      - uses: actions/upload-artifact@v4
        with:
          name: heytools-desktop-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.dmg
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*
