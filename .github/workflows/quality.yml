name: Repository quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate tool registry, offline cache, manifests and JavaScript
        run: node scripts/validate-repo.js
      - name: Test notification scheduling and action routing
        run: node scripts/test-notifications.js
      - name: Install browser test dependency
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/heytools-http.log 2>&1 &
      - name: Smoke test homepage and every local tool page
        run: node scripts/smoke-browser.mjs
