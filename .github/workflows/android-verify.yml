name: Android build verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [heytools-v2-audit]

permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install
      - name: Bundle website assets
        working-directory: native
        run: node scripts/prepare-web.js
      - name: Generate Android project
        working-directory: native
        run: npx cap add android
      - name: Apply Android plugins, permissions and resources
        working-directory: native
        run: node scripts/patch-android.js
      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync android
      - name: Compile Android debug APK (no signing secrets required)
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
