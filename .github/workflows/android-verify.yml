name: Android build verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [heytools-v2-audit, heytools-premium-notifications]

permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: native/package.json
      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install --no-audit --no-fund
      - name: Bundle website assets
        working-directory: native
        run: node scripts/prepare-web.js
      - name: Generate Android project
        working-directory: native
        run: npx cap add android
      - name: Apply Android plugins, permissions and resources
        working-directory: native
        run: node scripts/patch-android.js
      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync android
      - name: Compile Android debug APK (retry transient Maven rate limits)
        working-directory: native/android
        shell: bash
        run: |
          chmod +x gradlew
          for attempt in 1 2 3 4; do
            echo "Android Gradle build attempt ${attempt}/4"
            if ./gradlew assembleDebug --no-daemon --max-workers=2; then
              exit 0
            fi
            if [ "${attempt}" -lt 4 ]; then
              delay=$((attempt * 30))
              echo "Gradle dependency resolution failed; waiting ${delay}s before retry."
              sleep "${delay}"
            fi
          done
          echo "Android Gradle build failed after four attempts."
          exit 1

      # Android 15 emulator for focused alarm and locked-screen audio behaviour.
      - name: Run focused alarm and background-audio tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          system-image-api-level: 35
          channel: stable
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash native/scripts/android-emulator-test.sh
      - name: Upload Android emulator diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-diagnostics
          path: |
            android-instrumentation-logcat.txt
            android-test-diagnostics/
          if-no-files-found: ignore
        env:
          # GitHub-hosted Ubuntu runners do not expose KVM; explicitly allow QEMU TCG.
          ANDROID_I_WANT_MY_TCG: 'yes'
